<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FastReports Document Layout</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 20px;
display: flex;
justify-content: center;
background: #f5f5f5;
}

.container {
width: 100%;
max-width: 800px;
background: #ffffff;
border: 1px solid #ddd;
border-radius: 12px;
padding: 20px;
box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.logo-section {
display: flex;
justify-content: flex-end;
margin-bottom: 20px;
}

.logo {
width: 120px;
height: 60px;
background: #e0e0e0;
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
font-size: 14px;
color: #555;
font-weight: bold;
}

.table-section {
display: flex;
justify-content: flex-start;
margin-bottom: 20px;
}

table {
border-collapse: separate;
border-spacing: 0 8px;
background: transparent;
}

td {
padding: 6px 4px;
font-size: 14px;
background: #e6f0ff;
}

td:nth-child(1) {
width: 20%;
border-radius: 8px 0 0 8px;
}

td:nth-child(2) {
width: 20%;
border-radius: 0 8px 8px 0;
}

.title {
text-align: center;
font-size: 18px;
font-weight: bold;
padding-top: 20px;
}
</style>
</head>
<body>
<div class="container">
<div class="logo-section">
<div class="logo">FastReports</div>
</div>

<div class="table-section">
<table>
<tr><td><strong>Patient Name:</strong></td><td>John Doe</td></tr>
<tr><td><strong>Date of Birth:</strong></td><td>01/01/1980</td></tr>
<tr><td><strong>Medical ID:</strong></td><td>123456789</td></tr>
<tr><td><strong>Physician:</strong></td><td>Dr. Smith</td></tr>
</table>
</div>

<div class="title">Document Title</div>
</div>
</body>
</html>
